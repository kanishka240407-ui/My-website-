<!DOCTYPE html>
<html>
<head>
  <title>Digital School Notice Board</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .notice-box {
      background: white;
      width: 90%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .notice {
      background: #e6e6e6;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>Digital School Notice Board</h1>

  <div class="notice-box">
    <h3>Latest Notices</h3>

    <div class="notice">📢 Holiday on Friday due to school event</div>
    <div class="notice">📢 PTM will be held on 25th November</div>
    <div class="notice">📢 New timetable updated!</div>

  </div>

</body>
  </html>

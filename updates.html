<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Panel</title>
    <link rel="stylesheet" href="Style.css">

    <style>
        .admin-container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .admin-section {
            margin-bottom: 40px;
        }

        .admin-section h3 {
            margin-bottom: 15px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3a86ff;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <h1 class="logo">Digital Notice Board</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a class="active" href="updates.html">Updates</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container">
        <h2>Admin Update Panel</h2>

        <!-- NOTICE UPDATE SECTION -->
        <div class="admin-section">
            <h3>Update Notices</h3>
            <input type="text" placeholder="Enter Notice Title">
            <textarea placeholder="Enter Notice Description"></textarea>
            <button>Submit Notice</button>
        </div>

        <!-- TIMETABLE UPDATE SECTION -->
        <div class="admin-section">
            <h3>Update Timetable</h3>
            <select>
                <option>Select Day</option>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
            </select>

            <input type="text" placeholder="Enter Subject Name">
            <input type="text" placeholder="Enter Teacher Name">
            <input type="text" placeholder="Enter Time (e.g. 9:00 AM)">
            <button>Update Timetable</button>
        </div>

    </div>

</body>
            </html>

<section class="hero">
    <h2>Admin Panel – Update Notices & Timetable</h2>
    <p>Here you can add new notices or update the timetable in the digital board.</p>
</section>

<section class="update-section">

    <div class="update-box">
        <h3>Add New Notice</h3>
        <input type="text" placeholder="Enter Notice Title">
        <textarea placeholder="Enter Notice Description"></textarea>
        <button class="btn">Add Notice</button>
    </div>

    <div class="update-box">
        <h3>Update Timetable</h3>
        <input type="text" placeholder="Day (e.g., Monday)">
        <input type="text" placeholder="Subject">
        <input type="text" placeholder="Teacher">
        <input type="text" placeholder="Time">
        <button class="btn">Update Timetable</button>
    </div>

</section>
